name: Refresh HubSpot data

on:
  schedule:
    - cron: "17 23 * * *"   # 07:17 Manila / 06:17 Bangkok, daily
  workflow_dispatch: {}      # "Run workflow" button for an on-demand refresh

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull SEA pipeline from HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/fetch_hubspot.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/; then echo "No change"; exit 0; fi
          git config user.name "sea-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sea.json data/details.json
          git commit -m "Refresh HubSpot data $(date -u +%F)"
          git push
